name: CI

on:
  pull_request:
  push:
    branches: [$default-branch]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: relay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENV: test
      SECRET_KEY: ci-test-secret-key
      DATABASE_URL: postgresql+asyncpg://relay:relay@localhost:5432/relay_test
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: mypy --strict
        run: uv run mypy

      - name: Run Alembic migrations
        working-directory: apps/api
        run: uv run --package relay-api alembic upgrade head

      - name: pytest (unit + integration + differential) with coverage
        working-directory: apps/api
        run: |
          uv run --package relay-api pytest \
            --cov=src/relay_api/engine --cov=src/relay_api/features \
            --cov-report=term-missing --cov-fail-under=85

  frontend:
    name: Frontend (eslint, tsc, build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: eslint
        run: pnpm --filter @relay/web lint

      - name: tsc --noEmit
        run: pnpm --filter @relay/web build # `next build` also type-checks and regenerates route types
