[project]
name = "relay-api"
version = "0.1.0"
description = "Relay backend: shared correlation engine + FastAPI service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "authlib>=1.3.2",
    "httpx>=0.27",
    "pyjwt>=2.9",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "sentry-sdk[fastapi]>=2.17",
    "python-json-logger>=2.0.7",
    "cryptography>=43.0",
    "pgvector>=0.3.6",
    "openai>=1.54",
    "python-dateutil>=2.9",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-env>=1.1",
    "aiosqlite>=0.20",
    "types-redis>=4.6",
    "types-python-dateutil>=2.9",
    "celery-types>=0.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relay_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# core/db.py's async engine is a module-level singleton, bound to whichever
# event loop first uses it — matching production, where one loop lives for
# the process's whole lifetime. pytest-asyncio's default is a fresh loop
# per test function, which breaks that singleton on the second DB-touching
# test ("Future attached to a different loop"). Session-scoped loop fixes it.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
env = [
    "ENV=test",
    # D: = fallback default, don't override a real env var that's already set
    # (e.g. CI's job-level `env:` block, or a local `export` for one-off runs
    # against a different port/container) — see docs/phases/1-context-searcher.md.
    "D:SECRET_KEY=test-secret-key-not-for-production",
    "D:CONNECTOR_ENCRYPTION_KEY=Q63TEcnmpOHp8oADIoiuMlti2Al53hS-FNFt3u7b7Tk=",
    "D:DATABASE_URL=postgresql+asyncpg://relay:relay@localhost:5432/relay_test",
]
