[project]
name = "relay-api"
version = "0.1.0"
description = "Relay backend: shared correlation engine + FastAPI service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "authlib>=1.3.2",
    "httpx>=0.27",
    "pyjwt>=2.9",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "sentry-sdk[fastapi]>=2.17",
    "python-json-logger>=2.0.7",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-env>=1.1",
    "aiosqlite>=0.20",
    "types-redis>=4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relay_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
env = [
    "ENV=test",
    "SECRET_KEY=test-secret-key-not-for-production",
    "DATABASE_URL=postgresql+asyncpg://relay:relay@localhost:5432/relay_test",
]
