# Render Blueprint — backend web service (with the Celery worker running
# inside it as a background process, see below) and Redis.
# Database is Neon (external, not Render's own Postgres — see plan.md §1),
# so there's no `type: pserv`/postgres service here.
#
# Render's free tier does not support `type: worker` (background worker)
# services at all — only web services, so there's no standalone
# `relay-worker` service here. Instead `relay-api`'s startCommand backgrounds
# the Celery worker+beat process (`&`) and runs uvicorn as the foreground
# process Render actually monitors. This would otherwise mean the 15-minute
# periodic resync (`jobs/celery_app.py`'s beat schedule) stops firing
# whenever Render's free *web* services sleep after ~15 minutes of no
# incoming HTTP traffic — mitigated by an external cron/uptime pinger
# hitting `/healthz` often enough to keep the service (and the backgrounded
# Celery process living inside it) from ever sleeping in the first place.
# If that pinger ever stops, this reverts to "resync catches up on the next
# real request" rather than a hard failure.
#
# Render's Blueprint schema does evolve (e.g. the managed Redis service
# type has been renamed before) — if `type: redis` below is rejected when
# you first sync this Blueprint, check Render's current Blueprint spec
# reference for the current name and swap it; everything else here should
# still hold.
#
# First-time setup, after this Blueprint is synced in Render's dashboard:
#   1. Every `sync: false` var below needs its real value pasted in once,
#      in Render's dashboard — none of them are safe to commit.
#   2. `FRONTEND_URL` can't be a real value on the very first sync (the
#      Vercel URL doesn't exist yet) — use a placeholder, then come back
#      and set the real one once it's known, and redeploy. OAuth redirect
#      URIs are built from this value now, not this service's own domain
#      (ADR 0024 — Vercel's own `BACKEND_API_URL` needs the reverse: this
#      service's real `.onrender.com` URL, set the same way).

envVarGroups:
  - name: relay-shared
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: SECRET_KEY
        sync: false
      - key: CONNECTOR_ENCRYPTION_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      # Connector (data-access) OAuth apps — needed by the worker too,
      # for refreshing a stored access token mid-sync, not just by the
      # web service's own OAuth callback routes.
      - key: GITHUB_CONNECTOR_CLIENT_ID
        sync: false
      - key: GITHUB_CONNECTOR_CLIENT_SECRET
        sync: false
      - key: SLACK_CONNECTOR_CLIENT_ID
        sync: false
      - key: SLACK_CONNECTOR_CLIENT_SECRET
        sync: false
      - key: JIRA_CONNECTOR_CLIENT_ID
        sync: false
      - key: JIRA_CONNECTOR_CLIENT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # Swap to "openai" once OpenAI billing is set up (ADR 0009) — Gemini
      # is the free stand-in used during development.
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false

services:
  - type: web
    name: relay-api
    runtime: python
    plan: free
    buildCommand: pip install uv && uv sync --frozen --no-dev
    # `preDeployCommand` needs a paid plan — not available on free tier, so
    # migrations are chained in here instead (`alembic upgrade head` is a
    # safe no-op once already at head, so running it on every boot, not
    # just real deploys, is fine). The Celery worker+beat process is
    # backgrounded (`&` inside the subshell, which returns immediately) so
    # uvicorn — the process Render actually health-checks — ends up in the
    # foreground; see the top-of-file note on what this trades away.
    # `--pool=solo` (no forking) instead of Celery's default `prefork`
    # pool — found live: the default spawned 8 concurrent worker
    # processes, each a full copy of the app, blowing well past the
    # free tier's 512MB limit before uvicorn got a share. The jobs here
    # are I/O-bound (waiting on GitHub/Slack/Jira API calls), not
    # CPU-bound, so running them one at a time in a single process costs
    # nothing functionally at this scale.
    startCommand: >-
      uv run --package relay-api alembic -c apps/api/alembic.ini upgrade head &&
      (uv run --package relay-api celery -A relay_api.jobs.celery_app worker -B --loglevel=info --pool=solo &) &&
      uv run --package relay-api uvicorn relay_api.main:app
      --app-dir apps/api/src --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - fromGroup: relay-shared
      - key: ENV
        value: production
      # Blank on first sync — see the setup notes above.
      - key: FRONTEND_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: relay-redis
          property: connectionString
      # Login OAuth apps (identity-only scopes, ADR 0003) — the web
      # service handles these callbacks, the worker never does.
      - key: GITHUB_LOGIN_CLIENT_ID
        sync: false
      - key: GITHUB_LOGIN_CLIENT_SECRET
        sync: false
      - key: SLACK_LOGIN_CLIENT_ID
        sync: false
      - key: SLACK_LOGIN_CLIENT_SECRET
        sync: false
      - key: GOOGLE_LOGIN_CLIENT_ID
        sync: false
      - key: GOOGLE_LOGIN_CLIENT_SECRET
        sync: false

  - type: redis
    name: relay-redis
    plan: free
    ipAllowList: [] # no external access — only relay-api/relay-worker need it, both already on Render's internal network
